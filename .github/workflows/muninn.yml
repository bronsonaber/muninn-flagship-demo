name: Muninn Context Receipt
on: pull_request
permissions:
  pull-requests: write
  contents: read
jobs:
  context-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Alkhemy-AI/muninn-receipt-action@cf6c87b03f85dd4ea57d50d07f62d3fb7aabc009  # pinned: v1
        with:
          server-url: 'https://muninn-edge.bronson-aber.workers.dev'
          server-pubkey: ${{ vars.MUNINN_SERVER_PUBKEY }}
          client-key-id: ${{ vars.MUNINN_CLIENT_KEY_ID }}
          client-private-key: ${{ secrets.MUNINN_CLIENT_PRIVATE_KEY_PEM }}
